[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelbit-bitrix24-client"
version = "0.1.0"
description = "Apache-клиент Bitrix24 REST (incoming webhook) — общий для Интелбит MCP и Река-коннектора"
authors = [{ name = "Святослав Михайлов", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-bitrix24-client"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-bitrix24-client"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — кириллические «двойники»; проект ведёт комментарии по-русски.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
